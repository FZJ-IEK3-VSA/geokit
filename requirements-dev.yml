name: geokit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<=3.13.5
  - jupyter <=1.1.1
  - descartes <=1.1.0
  - pip <=25.5
  - matplotlib <=3.10.5
  - pandas <=2.3.1
  - numpy <=2.3.2
  - scipy <=1.16.1
  - scikit-learn <=1.7.1
  - gdal 3.4.3|3.9.3|3.10
  - smopy 0.0.7|0.0.8
  - geopandas <=1.1.1
  - nbval
  - pooch <=1.8.2
  - structlog <=25.4.0
  - rich <=14.1.0
  - psutil <=7.0.0
  - tqdm
  # development dependencies
  - pytest <=8.4.1
  - pytest-xdist <=3.8.0
  - pytest-cov <=6.2.1
  - ruff
  - typeguard <=4.4.4
  - nbconvert <=7.16.6
  - jupyter-book
  - sphinx-autoapi
  - astroid <=3.3.8
