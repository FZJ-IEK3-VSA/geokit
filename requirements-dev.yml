name: geokit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.8,<=3.10
  - pytest
  - pytest-cov
  - pylint
  - autopep8
  - jupyter
  - notebook
  - jupyterlab
  - pip
  - matplotlib
  - descartes
  - pandas >=1.1.3,<=2.3.1
  - numpy >=1.19.5
  - scipy >=1.6.0,<=1.13.1
  - scikit-learn
  - gdal>=2.4.0, 3.4.*
  - smopy
