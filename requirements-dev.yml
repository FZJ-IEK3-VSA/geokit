name: geokit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<=3.13.9
  - jupyter <=1.1.1
  - descartes <=1.1.0
  - pip <=26.0.1
  - matplotlib <=3.10.8
  - pandas >=1.4.0,<=2.3.3
  - numpy >=1.26.0,<=2.4.3
  - scipy >=1.10.0,<=1.16.3
  - scikit-learn >=1.3.0,<=1.8.0
  - gdal >=3.9.3,<=3.10
  - smopy >=0.0.7,<=0.0.8
  - geopandas >=1.0.0,<=1.1.3
  - psutil >=5.8.0,<=7.2.2
  - structlog <=25.5.0
  - rich <=14.3.3
  - pandas-stubs <=2.3.3.260113
  - scipy-stubs <=1.17.0.2
  - requests <=2.33.1
  # development dependencies
  - pytest <=9.0.3
  - pytest-xdist <=3.8.0
  - pytest-cov <=7.1.0
  - ruff =0.14.1
  - typeguard <=4.5.1
  - nbconvert <=7.17.0
  - nbval <=0.11.0
  # documentation (MkDocs)
  - mkdocs >=1.6,<1.7
  - mkdocs-material >=9.5
  - mkdocstrings >=0.25
  - mkdocstrings-python >=1.10
  - mkdocs-jupyter >=0.25
  - mkdocs-gen-files >=0.5
  - mkdocs-literate-nav >=0.6
  - mkdocs-section-index >=0.3
  - griffe >=0.45
  - codespell
