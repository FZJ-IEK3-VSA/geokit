name: geokit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python
  - pytest
  - pytest-cov
  - pylint
  - autopep8
  - jupyter
  - notebook
  - jupyterlab
  - pip
  - matplotlib
  - descartes
  - pandas >=1.1.3,<=2.3.1
  - numpy <1.24,>=1.15.0
  - scipy
  - scikit-learn <1.3
  # Due to GDAL dependency constraints, this version of Geokit cannot be installed on macOS 14 and above.
  - gdal >=2.4.3,<=3.2.1,!=3.0.0,!=3.0.1,!=3.0.2,!=3.0.3,!=3.0.4,!=3.1.0,!=3.1.0,!=3.1.1,!=3.1.2,!=3.1.3,!=3.1.4
  - smopy
