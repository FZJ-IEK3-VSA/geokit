name: geokit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.8,<=3.10
  - pytest <=8.4.1
  - pytest-cov <=6.2.1
  - pylint
  - autopep8
  - jupyter
  - notebook
  - jupyterlab
  - pip
  - matplotlib <=3.9.1
  - descartes <=1.1.0
  - pandas >=1.1.3,<=2.3.1
  - numpy >=1.19.5,<=1.26.4
  - scipy >=1.6.0,<=1.15.2
  - scikit-learn >=1.3.0,<=1.7.1
  - gdal 3.3.2|3.3.3|3.4.2|3.4.3
  - smopy >=0.0.7,<=0.0.0
  - geopandas <=0.14.4
