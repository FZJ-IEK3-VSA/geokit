name: geokit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.7,<=3.9
  - pytest <=8.4.1
  - pytest-cov <=6.2.1
  - pylint
  - autopep8
  - jupyter <=1.1.1
  - pip <=25.2
  - matplotlib <=3.9.1
  - descartes <=1.1.0
  - pandas >=1.1.3,<=2.3.1
  - numpy >=1.16.0,<=1.23.5
  - scipy >=1.5.2,<=1.13.1
  - scikit-learn >=0.22,<=1.2.2
  # Due to GDAL dependency constraints, this version of Geokit cannot be installed on macOS 14 and above.
  - gdal 2.4.3|2.4.4|3.2.0|3.2.1
  - smopy 0.0.7|0.0.8
