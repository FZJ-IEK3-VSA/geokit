# Sets the maximum acceptable line length


# [lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.

line-length = 120
[lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[lint]
select = ["D", "ARG"]
ignore = [
    "F401", # imported but unused
    "F405", # Variable is undefined or from star import
    "F403", #  `from test.helpers import *` used; unable to detect undefined names
    "F811", # Redefinition of unused variable
    "F541", # f-string without any placeholders
    "F841", # variable is assigned to but never used
    "E402", # Module level import not at top of file
    "E714", # Test for object identity should be `is not`
    "E711", # Comparison to `None` should be `is None`
    "E712", # Avoid equality comparisons to `False`; use `not l1 == l3:` for false checks
    "E713", # Test for membership should be `not in`
    "E741", # Ambiguous variable name: `l`
    "E721", # E721 Use `is` and `is not` for type comparisons, or `isinstance()` for isinstance checks
    "E722", # Do not use bare `except`
    "D100", # Missing docstring in public module
    "D401", # First line of docstring should be in imperative mood: "Convenience function to apply geopandas methods to a geokit-style"
    "D101",
    "D103",
    "D205", # blank line required between summary line and description
    "D404", # First word of the docstring should not be "This"
    "D105", # Missing docstring in magic method
    "D102", # Missing docstring in public method
    "D104", #First line should end with a period
]
unfixable = ["F401"]

[lint.pydocstyle]
convention = "numpy"
