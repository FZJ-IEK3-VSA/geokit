on:
  workflow_dispatch:
  # push:
  #   branches: [270_numpybool]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        scipy_version: [
            # "1.7.2",
            # "1.7.3",
            # "1.8.0",
            # "1.8.1",
            # "1.9.0",
            # "1.9.1",
            # "1.9.2",
            # "1.9.3", due to incompatability with asteroid
            "1.10.0",
            "1.10.1",
            "1.11.0",
            "1.11.1",
            "1.11.2",
            "1.11.3",
            "1.11.4",
            "1.12.0",
            "1.13.0",
            "1.13.1",
            "1.14.0",
            "1.14.1",
            "1.15.0",
            "1.15.1",
            "1.15.2",
            "1.16.0",
            "1.16.1",
            "1.16.2",
            "1.16.3",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    secrets:
      ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
      ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "docs/Examples"
      library_name: "scipy"
      library_version: ${{ matrix.scipy_version }}
      dependency_position_env_file: "7"
