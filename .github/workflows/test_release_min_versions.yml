on:
    pull_request:
        branches: ["master"]

jobs:
    TestMinDependencies:
        strategy:
            fail-fast: false
            matrix:
                runner_tag: ["ubuntu-latest", "macos-latest", "windows-latest"]
                dependencies:
                    [
                        {
                            library_name: pandas,
                            version: 1.3.4,
                            yaml_position: 5,
                        },
                        {
                            library_name: numpy,
                            version: 1.21.6,
                            yaml_position: 6,
                        },

                        {
                            library_name: scipy,
                            version: 1.10,
                            yaml_position: 7,
                        },
                        {
                            library_name: scikit-learn,
                            version: 1.3.0,
                            yaml_position: 8,
                        },
                        {
                            library_name: gdal,
                            version: 3.4.2,
                            yaml_position: 9,
                        },
                        {
                            library_name: geopandas,
                            version: 0.11,
                            yaml_position: 11,
                        },
                        {
                            library_name: psutil,
                            version: 5.8.0,
                            yaml_position: 12,
                        },
                    ]
        uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
        with:
            runner_tag: ${{ matrix.runner_tag }}
            requirements_file_name: requirements-dev.yml
            ipynb_example_folder: "Examples"
            library_name: ${{ matrix.dependencies.library_name }}
            library_version: ${{ matrix.dependencies.version }}
            dependency_position_env_file: ${{ matrix.dependencies.yaml_position }}
    TestMaxDependencies:
        strategy:
            fail-fast: false
            matrix:
                runner_tag: ["ubuntu-latest", "macos-latest", "windows-latest"]
                dependencies:
                    [
                        {
                            library_name: pandas,
                            version: 2.3.3,
                            yaml_position: 5,
                        },
                        {
                            library_name: numpy,
                            version: 2.3.3,
                            yaml_position: 6,
                        },

                        {
                            library_name: scipy,
                            version: 1.16.3,
                            yaml_position: 7,
                        },
                        {
                            library_name: scikit-learn,
                            version: 1.7.1,
                            yaml_position: 8,
                        },
                        { library_name: gdal, version: 3.10, yaml_position: 9 },
                        {
                            library_name: geopandas,
                            version: 1.1.1,
                            yaml_position: 11,
                        },
                        {
                            library_name: psutil,
                            version: 7.1.1,
                            yaml_position: 12,
                        },
                    ]
        uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
        with:
            runner_tag: ${{ matrix.runner_tag }}
            requirements_file_name: requirements-dev.yml
            ipynb_example_folder: "Examples"
            library_name: ${{ matrix.dependencies.library_name }}
            library_version: ${{ matrix.dependencies.version }}
            dependency_position_env_file: ${{ matrix.dependencies.yaml_position }}
