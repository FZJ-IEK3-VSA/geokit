jobs:
  TestPushCondaForgeDev:
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        psutil_version:
          [
            "5.8.0",
            "5.9.0",
            "5.9.1",
            "5.9.2",
            "5.9.3",
            "5.9.4",
            "5.9.5",
            "5.9.6",
            "5.9.7",
            "5.9.8",
            "6.0.0",
            "6.1.0",
            "6.1.1",
            "7.0.0",
            "7.1.0",
            "7.1.1",
            "7.1.2",
            "7.1.3",
            "7.2.0",
            "7.2.1",
            "7.2.2",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    secrets:
      ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
      ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "docs/Examples"
      library_name: "psutil"
      library_version: ${{ matrix.psutil_version }}
      dependency_position_env_file: "12"
      multiprocessing_example_string: "-n auto"
      multiprocessing_pytest_string: "-n auto"
