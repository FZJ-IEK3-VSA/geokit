name: Test Geokit for scikit-learn Versions
on: 
  workflow_dispatch:
    inputs:
      tags:
        description: 'Manual run' 
  pull_request:
    branches: 
      - master
    
jobs:
    TestGeokitForNumpyVersions:
        name: scikit-learn=${{ matrix.scikit_learn_version }},${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
                os: ["ubuntu-24.04","ubuntu-22.04","macos-13","macos-14","macos-15","windows-2025","windows-2022"]       
                # Proper versions: 
                scikit_learn_version: ["1.7.1","1.7.0","1.6.1","1.6.0","1.5.2","1.5.1","1.5.0","1.4.2","1.4.1","1.4.0","1.3.2","1.3.1","1.3.0"]
                # Failing version
                # scikit_learn_version: ["1.2.2","1.2.1","1.2.0","1.1.3","1.1.2","1.1.1","1.1.0","1.0.2","1.0.1","1.0","0.24.2","0.24.1","0.24.0","0.23.2","0.23.1","0.23.0","0.22.2","0.22.1","0.22","0.21.3","0.21.2","0.21.1","0.20.3"

        steps:
            - name: Setup Conda
              uses: conda-incubator/setup-miniconda@v3
              with:
                miniforge-version: latest
                channels: conda-forge,nodefaults
                activate-environment: test_env
                conda-remove-defaults: "true"
            - name: Checkout geokit
              uses: actions/checkout@v4
            # The next step involves editing the requirements-dev.yml file. This serves two purposes:
            # 1. It tests the other dependency ranges stated in the requirements-dev.yml file.
            # 2. It enables the ">", "<", "<=" and ">=" operators to be specified, which are not directly 
            # available via the mamba install... interface.
            - name: Update values.yaml
              uses: fjogeleit/yaml-update-action@main
              with:
                valueFile: 'requirements-dev.yml'
                commitChange: false
                method: CreateOrUpdate
                # The number in the brackets needs behind at "dependencies[...]" needs to ab adjusted when dependencies are
                # added or removed. It represents the position of the dependency in the "requirements-dev.yml" file starting
                # with the first dependency as "0".
                changes: |
                  {
                  "dependencies[14]": "scikit-learn =${{ matrix.scikit_learn_version }}"
                  }
            - name: Install libraries
              shell: pwsh
              id: install-step
              run: |
                    mamba env create --file=requirements-dev.yml -c conda-forge -c nodefaults -n test_env 
                    mamba run -n test_env python pip install -e . --no-deps
                    echo "Installation done"
                    mamba list -n test_env
                    echo "libraries printed" 
            - name: Run pytest for geokit
              shell: pwsh
              run: |
                    echo "Start ls"
                    ls
                    echo "ls terminated"
                    echo "start pytest"
                    mamba run -n test_env python -m pytest -vv
                    echo "Pytest done"
            - name: Run Examples
              shell: pwsh
              run: |
                    ls
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_01_srs.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_02_geometry.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_03_vector.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_04_raster.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_05_Extent.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_06_RegionMask.ipynb
                    mamba run -n geokit_env jupyter nbconvert --execute --to=python allow-errors=false ./Examples/example_07_GeographyHandling.ipynb
