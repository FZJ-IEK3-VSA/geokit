on:
  workflow_dispatch:
  push:
    branches: ["208_update_examples_2026"]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    strategy:
      fail-fast: false
      matrix:
        runner_tag:
          [
            "ubuntu-24.04",
            "ubuntu-22.04",
            "macos-14",
            "macos-15",
            "windows-2025",
            "windows-2022",
          ]
        python_version: ["3.14", "3.13", "3.12", "3.11", "3.10"]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    secrets:
      ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
      ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "docs/Examples"
      library_name: "python"
      library_version: ${{ matrix.python_version }}
      dependency_position_env_file: "0"
