on:
    pull_request:
        branches: ["dev"]

jobs:
    TestPullCondaForgeDev:
        strategy:
            fail-fast: false
            matrix:
                runner_tag: ["ubuntu-latest", "macos-latest", "windows-latest"]
                python_version: ["3.13"]
                include:
                    - python_version: "3.10"
                      runner_tag: "ubuntu-latest"
        uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
        secrets:
            ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
            ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
        with:
            runner_tag: ${{ matrix.runner_tag }}
            requirements_file_name: requirements-dev.yml
            ipynb_example_folder: "Examples"
            library_name: "python"
            library_version: ${{ matrix.python_version }}
            dependency_position_env_file: "0"
    TestMinDependencies:
        strategy:
            fail-fast: false
            matrix:
                runner_tag: ["self-hosted"]
                dependencies:
                    [
                        {
                            library_name: pandas,
                            version: 1.4.0,
                            yaml_position: 5,
                        },
                        {
                            library_name: numpy,
                            version: 1.26.0,
                            yaml_position: 6,
                        },

                        {
                            library_name: scipy,
                            version: 1.10.0,
                            yaml_position: 7,
                        },
                        {
                            library_name: scikit-learn,
                            version: 1.3.0,
                            yaml_position: 8,
                        },
                        {
                            library_name: gdal,
                            version: 3.9.3,
                            yaml_position: 9,
                        },
                        {
                            library_name: geopandas,
                            version: 1.0.0,
                            yaml_position: 11,
                        },
                        {
                            library_name: psutil,
                            version: 5.8.0,
                            yaml_position: 12,
                        },
                    ]
        uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
        secrets:
            ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
            ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
        with:
            runner_tag: ${{ matrix.runner_tag }}
            requirements_file_name: requirements-dev.yml
            ipynb_example_folder: "Examples"
            library_name: ${{ matrix.dependencies.library_name }}
            library_version: ${{ matrix.dependencies.version }}
            dependency_position_env_file: ${{ matrix.dependencies.yaml_position }}
