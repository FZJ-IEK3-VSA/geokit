name: Check code formatting and Linter hints

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.7"
      - name: Check Linter
        run: ruff check --output-format=github . --config ruff.toml
      - name: Check Format
        run: ruff format --check --config ruff.toml
