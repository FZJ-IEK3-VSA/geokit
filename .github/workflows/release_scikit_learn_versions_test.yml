on:
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for scikit-learn=${{ matrix.python_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag:
          [
            "ubuntu-24.04",
            "ubuntu-22.04",
            "macos-13",
            "macos-14",
            "macos-15",
            "windows-2025",
            "windows-2022",
          ]
        python_version:
          [
            "1.7.1",
            "1.7.0",
            "1.6.1",
            "1.6.0",
            "1.5.2",
            "1.5.1",
            "1.5.0",
            "1.4.2",
            "1.4.1",
            "1.4.0",
            "1.3.2",
            "1.3.1",
            "1.3.0",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements-dev.yml
      ipynb_example_folder: "Examples"
      library_name: "python"
      library_version: ${{ matrix.python_version }}
      dependency_position_env_file: "8"
