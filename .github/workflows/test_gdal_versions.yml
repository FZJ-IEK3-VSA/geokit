on:
  push:
    branches: "**"

jobs:
  TestGDALversions:
    name: Test GDAL ${{ matrix.gdal_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-latest, ubuntu-22.04, windows-latest, windows-2022, macos-latest, macos-13]
        gdal_version: ["3.4.0","3.4.1","3.4.2","3.4.3","3.9.0","3.9.1","3.9.2","3.9.3","3.10.0","3.10.1","3.10.2","3.10.3"]
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: geokit_env
          conda-remove-defaults: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update values.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'requirements-dev.yml'
          commitChange: false
          method: CreateOrUpdate
          changes: |
            {
              "dependencies[12]": "gdal= ${{ matrix.gdal_version }}"
            }
          
      - name: Create Env with GDAL ${{ matrix.gdal_version }}
        shell: pwsh
        run: |
          mamba env create --name geokit_env --yes --file requirements-dev.yml
          conda run --name geokit_env pip install -e . --no-deps
          echo "Installation done"
          conda list --name geokit_env
          echo "libaries printed"
      - name: Run Tests
        shell: pwsh
        run: |
          
          echo "start pytest"
          conda run --name geokit_env pytest -vv
          echo "Pytest done"
