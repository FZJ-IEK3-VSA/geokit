on:
  push:
    branches: "**"

jobs:
  TestGDALversions:
    name: Test GDAL ${{ matrix.gdal-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # macos-latest, macos-13, windows-latest, windows-2022 , ubuntu-22.04]
        gdal-version: ["3.11"] # "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10",

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: FZJ-IEK3-VSA/geokit

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: geokit_env
          conda-remove-defaults: true

      - name: Create Env with GDAL ${{ matrix.gdal-version }}
        shell: pwsh
        run: |
          mamba create -n geokit_env --yes -c conda-forge gdal=${{ matrix.gdal-version }}
          conda run -n geokit_env mamba install --yes -c conda-forge --file requirements-dev.yml
          conda run -n geokit_env pip install -e . --no-deps

      - name: Run Tests
        shell: pwsh
        run: |
          conda run -n geokit_env pytest -vv
