name: geokit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<=3.13.9
  - jupyter <=1.1.1
  - descartes <=1.1.0
  - pip <=26.2.1
  - matplotlib <=3.11.1
  - pandas >=1.4.0,<=3.0.5
  - numpy >=1.26.0,<=2.5.2
  - scipy >=1.10.0,<=1.18.0
  - scikit-learn >=1.3.0,<=1.9.0
  - gdal =3.10
  - smopy >=0.0.7,<=0.0.8
  - geopandas >=1.0.0,<=1.1.4
  - psutil >=5.8.0,<=7.2.2
  - structlog <=26.1.0
  - rich <=15.0.0
  - pandas-stubs <=3.0.5.260730
  - scipy-stubs <=1.18.0.1
  - requests <=2.34.2
  # development dependencies
  - pytest <=9.1.1
  - pytest-xdist <=3.8.0
  - pytest-cov <=7.1.0
  - ruff =0.14.1
  - typeguard <=4.6.0
  - nbconvert <=7.17.1
  - nbval <=0.11.0
  # documentation (MkDocs)
  - mkdocs >=1.6,<1.7
  - mkdocs-material >=9.5
  - mkdocstrings >=0.25
  - mkdocstrings-python >=1.10
  - mkdocs-jupyter >=0.25
  - mkdocs-gen-files >=0.5
  - mkdocs-literate-nav >=0.6
  - mkdocs-section-index >=0.3
  - griffe >=0.45
  - codespell
