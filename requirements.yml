name: geokit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.7,<=3.9
  # - pytest
  # - pytest-cov
  # - pylint
  # - autopep8
  # - jupyter
  # - notebook
  # - jupyterlab
  - pip
  - matplotlib
  - descartes
  - pandas >=1.1.3,<=2.3.1
  - numpy >=1.16.0,<=1.23.5
  - scipy >=1.5.2,<=1.13.1
  - scikit-learn >=0.22,<=1.2.2
  # Due to GDAL dependency constraints, this version of Geokit cannot be installed on macOS 14 and above.
  - gdal >=2.4.3,<=3.2.1,!=3.0.0,!=3.0.1,!=3.0.2,!=3.0.3,!=3.0.4,!=3.1.0,!=3.1.0,!=3.1.1,!=3.1.2,!=3.1.3,!=3.1.4
  - smopy >=0.0.7,<=0.0.8
