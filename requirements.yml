name: geokit_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<=3.13.9
  - jupyter <=1.1.1
  - descartes <=1.1.0
  - pip <=26.0.1
  - matplotlib <=3.10.5
  - pandas >=1.4.0,<=2.3.3
  - numpy >=1.26.0,<=2.4.2
  - scipy >=1.10.0,<=1.16.3
  - scikit-learn >=1.3.0,<=1.8.0
  - gdal 3.9.3|3.10
  - smopy 0.0.7|0.0.8
  - geopandas >=1.0.0,<=1.1.1
  - psutil >=5.8.0,<=7.2.2
  - structlog <=25.5.0
  - rich <=14.3.2
  - pandas-stubs <=2.3.3
  - scipy-stubs <=1.17.0.2
  - requests <=2.32.5
