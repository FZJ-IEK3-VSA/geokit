# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html

# The table of contents needs to be at the root level of the package because it is not possible to
# define relative parent folders within this table of contents file.

format: jb-book
root: docs/contents.md

options: # The options key will be applied to all chapters, but not sub-sections
  numbered: True

parts:
  - caption: Examples
    maxdepth: 3
    chapters:
      - file: docs/example_articles/_00_introduction.md
      # - caption: Download Weather Data
      - file: docs/example_articles/_01_raster_overview.md
        sections:
          - file: Examples/_01_raster/_1_create_raster_data.ipynb
          - file: Examples/_01_raster/_2_visualize_raster_data.ipynb
          - file: Examples/_01_raster/_3_extract_data_from_raster.ipynb
          - file: Examples/_01_raster/_4_polygonize_raster.ipynb
          - file: Examples/_01_raster/_5_warp_raster.ipynb
      - file: docs/example_articles/_02_vector_introduction.md
        sections:
          - file: Examples/_02_vector/_1_analyze_shape_files.ipynb
          - file: Examples/_02_vector/_2_analyze_geopackage.ipynb
          - file: Examples/_02_vector/_3_visualize_vector_data.ipynb
          - file: Examples/_02_vector/_4_attribute_extraction_and_manipulation.ipynb
          - file: Examples/_02_vector/_5_filter_vector_data_spatially.ipynb
          - file: Examples/_02_vector/_6_create_buffer.ipynb
          - file: Examples/_02_vector/_7_subdivide_geometries.ipynb
      - file: docs/example_articles/_03_create_geometries.md
        sections:
          - file: Examples/_03_create_geometries/_1_create_geometries.ipynb
      - file: docs/example_articles/_04_extent_based_operations.md
      - file: docs/example_articles/_05_combine_raster_and_vector.md
      - file: docs/example_articles/_06_application_examples.md
        sections:
          - file: Examples/_06_application_examples/_1_determine_offshore_turbine_depths.ipynb
      - file: docs/example_articles/_07_configuration.md
        sections:
          - file: Examples/_07_configuration_options/_01_srs.ipynb
          - file: Examples/_07_configuration_options/_02_c_datatypes.ipynb

  - caption: API
    chapters:
      # The API documentation is written to the folder
      - file: _readthedocs/geokit/index.rst
  - caption: FAQ
    chapters:
      - file: docs/FAQ.md
      - file: docs/articles/known_issues.md
