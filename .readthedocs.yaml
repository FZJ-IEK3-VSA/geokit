# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: mambaforge-latest
  jobs:
    pre_build:
      - conda run --name $READTHEDOCS_VERSION pip install -e . --no-deps
      - conda list -n $READTHEDOCS_VERSION
      # Execute the example notebooks in parallel before the build. mkdocs-jupyter
      # is configured with execute:False and renders these outputs. The GDAL (_2)
      # and GeoPandas+Rasterio (_3) comparison notebooks are skipped here (they
      # need rasterio, not a docs dependency) and rendered from committed outputs.
      - conda run --name $READTHEDOCS_VERSION python docs/scripts/execute_notebooks.py

    build:
      html:
        - conda run --name $READTHEDOCS_VERSION mkdocs build --site-dir $READTHEDOCS_OUTPUT/html

conda:
  environment: requirements-dev.yml

mkdocs:
  configuration: mkdocs.yml
