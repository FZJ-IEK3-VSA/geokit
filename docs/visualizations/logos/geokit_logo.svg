  <!-- Polygon lines overlay to represent vector data -->
  <g id="polygonLines" stroke="#000000" stroke-width="3" fill="none" opacity="0.6">
    <!-- G: Single continuous path tracing all pixels with 5px gap -->
    <!-- Trace outer edge, dip into the "mouth" cavity, trace around it, exit, continue outer edge -->
    <path d="M 55,35 L 143,35 L 143,83 L 115,83 L 115,63 L 83,63 L 83,135 L 115,135 L 115,123 L 95,123 L 95,95 L 143,95 L 143,163 L 55,163 Z" stroke-linejoin="round"/>
    
    <!-- e: Outer + inner path with constant 5px gap to the pixel edges -->
    <!-- Pixels at: (180,60),(200,60),(160,80),(220,80),(160,100),(180,100),(200,100),(160,120),(180,140),(200,140),(220,140) -->
    <!-- Outer outline (single closed path) -->
    <path d="M 175,55 L 223,55 L 223,75 L 243,75 L 243,103 L 223,103 L 223,123 L 183,123 L 183,135 L 243,135 L 243,163 L 175,163 L 175,143 L 155,143 L 155,75 L 175,75 Z" stroke-linejoin="round"/>
    <!-- Inner outline (single closed path for the upper cavity; constant 5px gap to pixel edges) -->
    <path d="M 185,85 L 213,85 L 213,95 L 185,95 Z" stroke-linejoin="round"/>
    
    <!-- o: Left col x=260,y=80-138. Top x=280-318,y=60-78. Right col x=320,y=80-138. Bottom x=280-318,y=140-158 -->
    <path d="M 255,75 L 275,75 L 275,55 L 323,55 L 323,75 L 343,75 L 343,143 L 323,143 L 323,163 L 275,163 L 275,143 L 255,143 L 255,75" stroke-linejoin="round"/>
    <!-- o inner hole -->
    <path d="M 283,83 L 315,83 L 315,135 L 283,135 L 283,83" stroke-linejoin="round"/>
    
    <!-- K: Outer outline with constant 5px gap to pixel edges -->
    <path d="M 355,35 L 383,35 L 383,75 L 395,75 L 395,55 L 415,55 L 415,35 L 443,35 L 443,63 L 423,63 L 423,83 L 403,83 L 403,115 L 423,115 L 423,135 L 443,135 L 443,163 L 415,163 L 415,143 L 395,143 L 395,123 L 383,123 L 383,163 L 355,163 Z" stroke-linejoin="round"/>
    
    <!-- i: dot at x=460,y=40-58. stem at x=460,y=80-158 -->
    <path d="M 455,35 L 483,35 L 483,63 L 455,63 L 455,35" stroke-linejoin="round"/>
    <path d="M 455,75 L 483,75 L 483,163 L 455,163 L 455,75" stroke-linejoin="round"/>
    
    <!-- t: stem x=520,y=60-158. crossbar x=500-578,y=80-98. bottom-right x=540-578,y=140-158 -->
    <path d="M 515,55 L 543,55 L 543,75 L 583,75 L 583,103 L 543,103 L 543,135 L 583,135 L 583,163 L 515,163 L 515,103 L 495,103 L 495,75 L 515,75 L 515,55" stroke-linejoin="round"/>
  </g>
